<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="gemini-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="deepseek-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <filter id="pill-shadow" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="780" fill="url(#bg-grad)"/>

  <!-- Left Sidebar (Collapsible Nav) -->
  <rect x="0" y="0" width="68" height="780" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <!-- Hamburger Menu Icon -->
  <g transform="translate(24, 22)" stroke="#64748b" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="0" x2="20" y2="0"/>
    <line x1="0" y1="7" x2="20" y2="7"/>
    <line x1="0" y1="14" x2="20" y2="14"/>
  </g>
  <!-- New Chat Plus Button -->
  <g transform="translate(18, 76)">
    <circle cx="16" cy="16" r="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="16" y1="10" x2="16" y2="22" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="16" x2="22" y2="16" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Top App Header -->
  <rect x="68" y="0" width="1212" height="60" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
  <text x="96" y="37" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.02em">
    AI Compare
  </text>
  <rect x="204" y="22" width="76" height="20" rx="10" fill="#eff6ff"/>
  <text x="242" y="36" fill="#2563eb" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="700" text-anchor="middle">v2.0 LIVE</text>

  <!-- User Avatar (Top Right) -->
  <circle cx="1224" cy="30" r="15" fill="#3b82f6"/>
  <text x="1224" y="35" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SJ</text>

  <!-- User Prompt Message Bubble -->
  <g transform="translate(140, 95)">
    <circle cx="20" cy="20" r="16" fill="#0f172a"/>
    <text x="20" y="25" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SJ</text>
    <rect x="48" y="6" width="380" height="34" rx="17" fill="#f1f5f9"/>
    <text x="68" y="28" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">
      Compare quicksort vs mergesort with cache locality
    </text>
  </g>

  <!-- Side-by-Side Dual Comparison Boxes -->
  <!-- 1. LEFT BOX: Gemini -->
  <g transform="translate(140, 160)" filter="url(#card-shadow)">
    <!-- Box Container -->
    <rect width="475" height="460" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Box Header -->
    <path d="M 0 16 Q 0 0 16 0 L 459 0 Q 475 0 475 16 L 475 52 L 0 52 Z" fill="#f8fafc"/>
    <line x1="0" y1="52" x2="475" y2="52" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Gemini Spark Icon -->
    <g transform="translate(24, 18)">
      <path d="M10 0 C10 5.5 5.5 10 0 10 C5.5 10 10 14.5 10 20 C10 14.5 14.5 10 20 10 C14.5 10 10 5.5 10 0 Z" fill="url(#gemini-spark)"/>
    </g>
    <text x="52" y="32" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">Gemini</text>
    <rect x="114" y="19" width="105" height="20" rx="10" fill="#f3e8ff"/>
    <text x="166.5" y="33" fill="#7c3aed" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="600" text-anchor="middle">gemini-2.5-flash</text>

    <!-- Latency & TTFT Tag -->
    <rect x="375" y="19" width="76" height="20" rx="6" fill="#f1f5f9"/>
    <text x="413" y="33" fill="#64748b" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">⚡ 312ms</text>

    <!-- Gemini Streamed Response Content -->
    <g transform="translate(24, 76)">
      <text x="0" y="16" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Architectural Comparison:</text>

      <text x="0" y="44" fill="#334155" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">1. Cache Locality (L1/L2):</text>
      <text x="12" y="66" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5" line-height="1.5">
        Quicksort exhibits superior temporal and spatial cache locality
      </text>
      <text x="12" y="86" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">
        because partition operations access contiguous in-place array memory.
      </text>

      <text x="0" y="118" fill="#334155" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">2. Auxiliary Memory Overhead:</text>
      <text x="12" y="140" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">
        • Quicksort: O(log N) stack frames, 0 auxiliary allocation.
      </text>
      <text x="12" y="160" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">
        • Mergesort: O(N) auxiliary buffer causing memory bus saturation.
      </text>

      <!-- Code Snippet Box -->
      <rect x="0" y="180" width="427" height="150" rx="8" fill="#0f172a"/>
      <text x="14" y="202" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="10.5">// In-place Hoare partition with high L1 retention</text>
      <text x="14" y="222" fill="#f8fafc" font-family="'SF Mono', monospace" font-size="11">int partition(int arr[], int low, int high) {</text>
      <text x="14" y="242" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="11">    int pivot = arr[(low + high) / 2];</text>
      <text x="14" y="262" fill="#cbd5e1" font-family="'SF Mono', monospace" font-size="11">    while (arr[i] &lt; pivot) i++;</text>
      <text x="14" y="282" fill="#cbd5e1" font-family="'SF Mono', monospace" font-size="11">    while (arr[j] &gt; pivot) j--;</text>
      <text x="14" y="302" fill="#a855f7" font-family="'SF Mono', monospace" font-size="11">    if (i &gt;= j) return j; swap(arr[i], arr[j]);</text>
      <text x="14" y="320" fill="#f8fafc" font-family="'SF Mono', monospace" font-size="11">}</text>

      <!-- Key Verdict -->
      <rect x="0" y="342" width="427" height="30" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="12" y="362" fill="#059669" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">
        ✓ Verdict: Quicksort is ~2.8× faster on sequential in-memory arrays.
      </text>
    </g>
  </g>

  <!-- 2. RIGHT BOX: DeepSeek -->
  <g transform="translate(640, 160)" filter="url(#card-shadow)">
    <!-- Box Container -->
    <rect width="475" height="460" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Box Header -->
    <path d="M 0 16 Q 0 0 16 0 L 459 0 Q 475 0 475 16 L 475 52 L 0 52 Z" fill="#f8fafc"/>
    <line x1="0" y1="52" x2="475" y2="52" stroke="#f1f5f9" stroke-width="1"/>

    <!-- DeepSeek Whale / Shield Icon -->
    <g transform="translate(24, 18)">
      <circle cx="10" cy="10" r="10" fill="url(#deepseek-blue)"/>
      <path d="M6 10 C6 7.5 8 6 10 6 C12.5 6 14 8 14 11 C14 13 12 14.5 10 14.5 C7.5 14.5 6 12 6 10 Z" fill="#ffffff"/>
      <circle cx="8.5" cy="9.5" r="1.2" fill="#0284c7"/>
    </g>
    <text x="52" y="32" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">DeepSeek</text>
    <rect x="130" y="19" width="102" height="20" rx="10" fill="#eff6ff"/>
    <text x="181" y="33" fill="#0284c7" font-family="'SF Mono', Menlo, monospace" font-size="10" font-weight="600" text-anchor="middle">deepseek-chat</text>

    <!-- Latency & TTFT Tag -->
    <rect x="375" y="19" width="76" height="20" rx="6" fill="#f1f5f9"/>
    <text x="413" y="33" fill="#64748b" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">⚡ 480ms</text>

    <!-- DeepSeek Streamed Response Content -->
    <g transform="translate(24, 76)">
      <!-- Reasoning Thinking Collapsible Banner -->
      <rect x="0" y="0" width="427" height="32" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="12" y="20" fill="#64748b" font-family="'SF Mono', monospace" font-size="10.5" font-weight="600">
        💭 Thought Process: Analyzing cache lines (64B) &amp; prefetchers...
      </text>

      <text x="0" y="56" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">Hardware &amp; Algorithmic Analysis:</text>

      <text x="0" y="82" fill="#334155" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">1. Cache Line Prefetching:</text>
      <text x="12" y="104" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">
        Modern CPUs load 64-byte blocks. Quicksort's dual-pointer scans
      </text>
      <text x="12" y="124" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">
        trigger automatic hardware prefetching with near-zero cache misses.
      </text>

      <text x="0" y="156" fill="#334155" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">2. External Memory &amp; Stability Tradeoff:</text>
      <text x="12" y="178" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">
        • Mergesort is predictable O(N log N) worst-case and strictly stable.
      </text>
      <text x="12" y="198" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11.5">
        • Ideal for linked lists or external sorting where random access fails.
      </text>

      <!-- Benchmark Metrics Table -->
      <rect x="0" y="220" width="427" height="110" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <text x="14" y="242" fill="#0f172a" font-family="'SF Mono', monospace" font-size="11" font-weight="700">METRIC</text>
      <text x="180" y="242" fill="#3b82f6" font-family="'SF Mono', monospace" font-size="11" font-weight="700">QUICKSORT</text>
      <text x="310" y="242" fill="#64748b" font-family="'SF Mono', monospace" font-size="11" font-weight="700">MERGESORT</text>
      <line x1="14" y1="252" x2="413" y2="252" stroke="#e2e8f0" stroke-width="1"/>

      <text x="14" y="272" fill="#475569" font-family="'SF Mono', monospace" font-size="10.5">L1 Cache Misses</text>
      <text x="180" y="272" fill="#10b981" font-family="'SF Mono', monospace" font-size="10.5" font-weight="600">Low (Linear)</text>
      <text x="310" y="272" fill="#f59e0b" font-family="'SF Mono', monospace" font-size="10.5">High (Aux Copy)</text>

      <text x="14" y="294" fill="#475569" font-family="'SF Mono', monospace" font-size="10.5">Memory Stability</text>
      <text x="180" y="294" fill="#ef4444" font-family="'SF Mono', monospace" font-size="10.5">Unstable</text>
      <text x="310" y="294" fill="#10b981" font-family="'SF Mono', monospace" font-size="10.5" font-weight="600">Stable</text>

      <text x="14" y="316" fill="#475569" font-family="'SF Mono', monospace" font-size="10.5">Time Complexity</text>
      <text x="180" y="316" fill="#3b82f6" font-family="'SF Mono', monospace" font-size="10.5">Avg O(N log N)</text>
      <text x="310" y="316" fill="#3b82f6" font-family="'SF Mono', monospace" font-size="10.5">Guaranteed O(N log N)</text>

      <!-- Key Verdict -->
      <rect x="0" y="342" width="427" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="12" y="362" fill="#1d4ed8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">
        ✓ Recommendation: Use Dual-Pivot Quicksort for CPU caches, Mergesort for stable sorting.
      </text>
    </g>
  </g>

  <!-- Bottom Floating Search / Prompt Input Bar -->
  <g transform="translate(140, 650)" filter="url(#pill-shadow)">
    <rect width="975" height="52" rx="26" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Cursor and Placeholder Text -->
    <line x1="28" y1="18" x2="28" y2="34" stroke="#3b82f6" stroke-width="2"/>
    <text x="36" y="31" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      Enter a prompt to compare AI models. Press Cmd/Ctrl + Enter to send message
    </text>

    <!-- Send Button Icon -->
    <circle cx="943" cy="26" r="16" fill="#0f172a"/>
    <path d="M939 26 L947 26 M944 22 L948 26 L944 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Footer Disclaimer -->
  <text x="627" y="730" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">
    Responses may contain inaccuracies. Always verify critical information.
  </text>
</svg>
