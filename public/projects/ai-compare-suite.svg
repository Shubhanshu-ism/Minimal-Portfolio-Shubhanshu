<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" class="pa" role="img" aria-label="AI Compare: Gemini and DeepSeek answering the same prompt side by side">
<title>AI Compare: Gemini and DeepSeek answering the same prompt side by side</title>
<defs><style>.pa{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
.pa text{white-space:pre}
.pa .m{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.pa .bg{fill:var(--bg-main,#F8F9FA)}
.pa .cd{fill:var(--bg-card,#FFFFFF)}
.pa .in{fill:var(--bg-input,#F1F3F5)}
.pa .ln{stroke:var(--border-subtle,rgba(0,0,0,.07));stroke-width:1.5}
.pa .lnx{stroke:var(--text-dim,#475569);stroke-opacity:.35;stroke-width:1.5;fill:none}
.pa .t1{fill:var(--text-accent,#0F172A)}
.pa .t2{fill:var(--text-dim,#475569)}
.pa .t3{fill:var(--text-dim,#475569);fill-opacity:.7}
.pa .sk{fill:var(--text-dim,#475569);fill-opacity:.13}
.pa .dt{fill:var(--text-dim,#475569);fill-opacity:.28}</style></defs>
<rect width="960" height="600" class="bg"/>
<rect width="960" height="44" class="cd"/>
<line x1="0" y1="44" x2="960" y2="44" class="ln"/>
<circle cx="22" cy="22" r="5" class="dt"/>
<circle cx="40" cy="22" r="5" class="dt"/>
<circle cx="58" cy="22" r="5" class="dt"/>
<text x="84" y="27" class="t1" font-size="14"><tspan font-weight="600">AI Compare</tspan><tspan class="m t3" font-size="12" dx="12">ai-compare-steel.vercel.app</tspan></text>
<rect x="853" y="11" width="83" height="22" rx="11" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-opacity="0.28" stroke-width="1.5"/><circle cx="865" cy="22" r="3" fill="#06B6D4"/><text x="874" y="25.96" class="m" fill="#06B6D4" font-size="11" font-weight="600">2 MODELS</text>
<rect x="24" y="60" width="912" height="52" rx="26" class="cd ln"/><circle cx="54" cy="86" r="14" class="in"/><text x="54" y="90" class="t2" font-size="10" font-weight="700" text-anchor="middle">SJ</text><text x="80" y="91" class="t1" font-size="14">Compare quicksort and mergesort for cache locality</text><circle cx="906" cy="86" r="16" fill="#06B6D4"/><path d="M899 86 H912 M907 81 L912 86 L907 91" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="128" width="448" height="340" rx="14" class="cd ln"/><circle cx="50" cy="158" r="5" fill="#3B82F6"/><text x="64" y="163" class="t1" font-size="15" font-weight="600">Gemini</text><rect x="126.19999999999999" y="147" width="112" height="20" rx="10" class="in ln"/><text x="134.2" y="160.6" class="t2 m" font-size="10" font-weight="600">gemini-2.5-flash</text><rect x="372" y="146" width="84" height="22" rx="11" class="in ln"/><text x="381" y="160.6" class="t2 m" font-size="10" font-weight="600">TTFT 312 ms</text><line x1="24" y1="182" x2="472" y2="182" class="ln"/><text x="48" y="214" class="t2" font-size="13">Quicksort partitions in place, so it walks</text><text x="48" y="236" class="t2" font-size="13">contiguous memory and stays in L1/L2 cache.</text><text x="48" y="258" class="t2" font-size="13">Mergesort needs an O(n) buffer, which adds</text><text x="48" y="280" class="t2" font-size="13">extra memory traffic on every merge pass.</text><rect x="48" y="310" width="400" height="64" rx="10" class="in"/><text x="64" y="336" class="t1 m" font-size="12">while (a[i] &lt; pivot) i++;   // sequential</text><text x="64" y="358" class="t1 m" font-size="12">while (a[j] &gt; pivot) j--;   // in place</text><line x1="48" y1="418" x2="448" y2="418" class="ln"/><text x="48" y="448" class="t3 m" font-size="11">412 tokens · 1.9 s</text><rect x="406" y="432" width="42" height="22" rx="11" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.28" stroke-width="1.5"/><text x="415" y="446.6" class="m" fill="#10B981" font-size="10" font-weight="600">done</text><rect x="488" y="128" width="448" height="340" rx="14" class="cd ln"/><circle cx="514" cy="158" r="5" fill="#06B6D4"/><text x="528" y="163" class="t1" font-size="15" font-weight="600">DeepSeek</text><rect x="607.6" y="147" width="94" height="20" rx="10" class="in ln"/><text x="615.6" y="160.6" class="t2 m" font-size="10" font-weight="600">deepseek-chat</text><rect x="836" y="146" width="84" height="22" rx="11" class="in ln"/><text x="845" y="160.6" class="t2 m" font-size="10" font-weight="600">TTFT 480 ms</text><line x1="488" y1="182" x2="936" y2="182" class="ln"/><text x="512" y="214" class="t2" font-size="13">Both are O(n log n) on average, but quicksort</text><text x="512" y="236" class="t2" font-size="13">has better locality: sequential scans let the</text><text x="512" y="258" class="t2" font-size="13">prefetcher stay ahead. Mergesort wins when you</text><text x="512" y="280" class="t2" font-size="13">need stability or are sorting linked lists.</text><rect x="512" y="314" width="360" height="9" rx="4.5" class="sk"/><rect x="512" y="336" width="300" height="9" rx="4.5" class="sk"/><rect x="512" y="358" width="330" height="9" rx="4.5" class="sk"/><rect x="732" y="376" width="2" height="16" rx="1" fill="#06B6D4"/><rect x="512" y="380" width="210" height="9" rx="4.5" class="sk"/><line x1="512" y1="418" x2="912" y2="418" class="ln"/><text x="512" y="448" class="t3 m" font-size="11">388 tokens · 2.4 s</text><rect x="828" y="432" width="84" height="22" rx="11" fill="#06B6D4" fill-opacity="0.12" stroke="#06B6D4" stroke-opacity="0.28" stroke-width="1.5"/><circle cx="840" cy="443" r="3" fill="#06B6D4"/><text x="849" y="446.6" class="m" fill="#06B6D4" font-size="10" font-weight="600">streaming</text><rect x="24" y="484" width="912" height="92" rx="14" class="cd ln"/><text x="44" y="510" class="t3 m" font-size="11" font-weight="600" letter-spacing="0.6">TIME TO FIRST TOKEN</text><text x="44" y="532" class="t2" font-size="12">Gemini</text><rect x="124" y="524" width="492" height="8" rx="4" class="sk"/><rect x="124" y="524" width="255.84" height="8" rx="4" fill="#3B82F6"/><text x="684" y="532" class="t2 m" font-size="12" text-anchor="end">312 ms</text><text x="44" y="556" class="t2" font-size="12">DeepSeek</text><rect x="124" y="548" width="492" height="8" rx="4" class="sk"/><rect x="124" y="548" width="393.6" height="8" rx="4" fill="#06B6D4"/><text x="684" y="556" class="t2 m" font-size="12" text-anchor="end">480 ms</text><rect x="716" y="512" width="200" height="40" rx="20" fill="none" class="lnx" stroke-dasharray="4 4"/><text x="816" y="537" class="t2" font-size="13" font-weight="500" text-anchor="middle">+ add provider</text>
</svg>
