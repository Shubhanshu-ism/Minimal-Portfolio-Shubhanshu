<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mb-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#mb-bg)"/>

  <!-- Main Window -->
  <rect x="50" y="40" width="1100" height="670" rx="16" fill="url(#mb-card)" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="50" y="40" width="1100" height="56" rx="16" fill="#0b0f17" stroke="#1f293d" stroke-width="1"/>
  <rect x="50" y="80" width="1100" height="16" fill="#0b0f17"/>

  <circle cx="85" cy="68" r="6" fill="#ef4444"/>
  <circle cx="105" cy="68" r="6" fill="#f59e0b"/>
  <circle cx="125" cy="68" r="6" fill="#10b981"/>

  <text x="600" y="73" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    MegaBlog &#8226; Full-Featured Production Publishing Platform (Appwrite Cloud Backend)
  </text>

  <!-- Left Sidebar (Editor) -->
  <g transform="translate(85, 120)">
    <rect width="490" height="555" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <!-- Subheader -->
    <rect width="490" height="42" rx="14" fill="#111827"/>
    <rect y="28" width="490" height="14" fill="#111827"/>
    <text x="20" y="26" fill="#f43f5e" font-family="'SF Mono', monospace" font-size="11" font-weight="700">MARKDOWN WYSIWYG EDITOR</text>
    <rect x="390" y="10" width="80" height="22" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="430" y="25" fill="#34d399" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">AUTOSAVED</text>

    <!-- Editor content -->
    <g font-family="'SF Mono', monospace" font-size="12" fill="#cbd5e1" transform="translate(20, 65)">
      <text y="20" fill="#64748b">---</text>
      <text y="40" fill="#f43f5e">title: <tspan fill="#f1f5f9">"Building Resilient Event-Driven Daemons"</tspan></text>
      <text y="60" fill="#f43f5e">author: <tspan fill="#f1f5f9">"Shubhanshu Jain"</tspan></text>
      <text y="80" fill="#f43f5e">tags: <tspan fill="#f1f5f9">["Node.js", "PM2", "DevOps", "Fintech"]</tspan></text>
      <text y="100" fill="#64748b">---</text>
      <text y="140" fill="#38bdf8" font-weight="700"># Engineering Zero-Downtime Microservices</text>
      <text y="170" fill="#94a3b8">In high-scale production systems handling 228K+</text>
      <text y="195" fill="#94a3b8">clicks daily, transient node crashes cannot result</text>
      <text y="220" fill="#94a3b8">in cascading service failure.</text>
      <text y="260" fill="#10b981">```javascript</text>
      <text y="285" fill="#e2e8f0">const daemon = new HealthPoller({</text>
      <text y="310" fill="#e2e8f0">  concurrency: 8,</text>
      <text y="335" fill="#e2e8f0">  backoffMs: 1500</text>
      <text y="360" fill="#e2e8f0">});</text>
      <text y="385" fill="#10b981">```</text>
      <text y="420" fill="#f59e0b">_Live synced via Appwrite Cloud Realtime WebSockets_</text>
    </g>
  </g>

  <!-- Right Sidebar (Live Preview & Features) -->
  <g transform="translate(605, 120)">
    <rect width="510" height="555" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    <rect width="510" height="42" rx="14" fill="#111827"/>
    <rect y="28" width="510" height="14" fill="#111827"/>
    <text x="20" y="26" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="11" font-weight="700">LIVE PRODUCTION READER VIEW</text>
    <rect x="400" y="10" width="90" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="445" y="25" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">APPWRITE 2.0</text>

    <!-- Reader View Cards -->
    <g transform="translate(25, 65)">
      <rect width="460" height="140" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="17" font-weight="700">Building Resilient Event-Driven Daemons</text>
      <text x="20" y="58" fill="#64748b" font-family="'SF Mono', monospace" font-size="11">By Shubhanshu Jain &#8226; 6 min read &#8226; 1.2K views</text>
      <text x="20" y="90" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" line-height="20">
        In high-scale production systems handling 228K+ clicks daily, transient node crashes cannot result in cascading service failure...
      </text>
      <rect x="20" y="105" width="65" height="20" rx="4" fill="#f43f5e" fill-opacity="0.15"/>
      <text x="52" y="119" fill="#fb7185" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">Node.js</text>
      <rect x="95" y="105" width="55" height="20" rx="4" fill="#3b82f6" fill-opacity="0.15"/>
      <text x="122" y="119" fill="#60a5fa" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">DevOps</text>
    </g>

    <!-- Architecture & Features Checklist -->
    <g transform="translate(25, 225)">
      <rect width="460" height="225" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="30" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Appwrite Cloud Backend Architecture</text>
      
      <text x="20" y="65" fill="#10b981" font-family="'SF Mono', monospace" font-size="12">✔ Authentication: Email/Password &amp; OAuth 2.0</text>
      <text x="20" y="95" fill="#10b981" font-family="'SF Mono', monospace" font-size="12">✔ Database: Real-time collection queries &amp; indexes</text>
      <text x="20" y="125" fill="#10b981" font-family="'SF Mono', monospace" font-size="12">✔ Storage: CDN-optimized image compression</text>
      <text x="20" y="155" fill="#10b981" font-family="'SF Mono', monospace" font-size="12">✔ Security: Role-Based Access Control (RBAC)</text>
      <text x="20" y="185" fill="#10b981" font-family="'SF Mono', monospace" font-size="12">✔ State Management: Redux Toolkit slice store</text>
    </g>

    <text x="255" y="475" fill="#64748b" font-family="'SF Mono', monospace" font-size="11" text-anchor="middle">
      100% Client-Side Rendered (CSR) &#8226; Sub-second Global CDN
    </text>
  </g>
</svg>
