<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg-grad)"/>

  <!-- Terminal Window Frame -->
  <rect x="50" y="40" width="1100" height="670" rx="16" fill="url(#card-grad)" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Window Titlebar -->
  <rect x="50" y="40" width="1100" height="52" rx="16" fill="#0b0f17" stroke="#1f293d" stroke-width="1"/>
  <rect x="50" y="76" width="1100" height="16" fill="#0b0f17"/>

  <!-- Traffic Lights -->
  <circle cx="85" cy="66" r="6.5" fill="#ef4444"/>
  <circle cx="107" cy="66" r="6.5" fill="#f59e0b"/>
  <circle cx="129" cy="66" r="6.5" fill="#10b981"/>

  <!-- Titlebar text -->
  <text x="600" y="71" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', monospace" font-size="13" font-weight="600" text-anchor="middle">
    pm2-auto-recovery-daemon — ssh://deploy@192.168.1.42 — 120×36
  </text>

  <!-- Badges in Titlebar right -->
  <rect x="1000" y="55" width="120" height="22" rx="11" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
  <circle cx="1014" cy="66" r="3.5" fill="#10b981"/>
  <text x="1025" y="70" fill="#34d399" font-family="'SF Mono', monospace" font-size="10" font-weight="700">DAEMON ACTIVE</text>

  <!-- Terminal Content Area -->
  <g font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="13" line-height="22">
    <!-- Header Banner -->
    <text x="85" y="130" fill="#f59e0b" font-weight="700">◆ PM2 Auto-Recovery &amp; Health Daemon v2.1.0</text>
    <text x="85" y="152" fill="#64748b">  Target: production-cluster-ap-south | Polling Interval: 5000ms | SSH Channel: Encrypted Keypair</text>

    <!-- Divider Line -->
    <line x1="85" y1="172" x2="1115" y2="172" stroke="#1e293b" stroke-width="1"/>

    <!-- PM2 Table Header -->
    <text x="85" y="202" fill="#94a3b8" font-weight="700">ID   APP NAME          MODE     PID     STATUS    RESTART   CPU     MEM       UPTIME</text>
    <line x1="85" y1="214" x2="1115" y2="214" stroke="#1e293b" stroke-width="1"/>

    <!-- Table Rows -->
    <text x="85" y="240" fill="#e2e8f0">0    api-gateway       cluster  14208   <tspan fill="#10b981" font-weight="700">online</tspan>    0         0.2%    64.2 MB   18d 4h</text>
    <text x="85" y="266" fill="#e2e8f0">1    payment-worker    fork     28911   <tspan fill="#10b981" font-weight="700">online</tspan>    1         0.0%    48.1 MB   7d 12h</text>
    <text x="85" y="292" fill="#e2e8f0">2    notification-svc  fork     —       <tspan fill="#ef4444" font-weight="700">errored</tspan>   3         0.0%    0.0 MB    0s <tspan fill="#ef4444">[UNRESPONSIVE]</tspan></text>
    <text x="85" y="318" fill="#e2e8f0">3    analytics-stream  cluster  19834   <tspan fill="#10b981" font-weight="700">online</tspan>    0         1.4%    112.5 MB  18d 4h</text>

    <!-- Divider -->
    <line x1="85" y1="344" x2="1115" y2="344" stroke="#1e293b" stroke-width="1"/>

    <!-- Live Event Log -->
    <text x="85" y="378" fill="#38bdf8" font-weight="700">[AUTONOMOUS RECOVERY EVENT LOG]</text>

    <text x="85" y="410" fill="#64748b">[00:24:18.210] <tspan fill="#38bdf8">INF</tspan> healthcheck ping to http://127.0.0.1:8082/healthz (timeout=2000ms)</text>
    <text x="85" y="434" fill="#64748b">[00:24:20.211] <tspan fill="#ef4444">ERR</tspan> healthcheck timed out after 2000ms (ECONNREFUSED 127.0.0.1:8082)</text>
    <text x="85" y="458" fill="#64748b">[00:24:20.212] <tspan fill="#f59e0b">WRN</tspan> Failure detected in service 'notification-svc'. Initiating self-healing loop...</text>
    <text x="85" y="482" fill="#64748b">[00:24:20.450] <tspan fill="#a855f7">SSH</tspan> Executing remote command: `pm2 restart notification-svc --update-env`</text>
    <text x="85" y="506" fill="#64748b">[00:24:21.840] <tspan fill="#10b981">SUC</tspan> Process restarted with PID 31042. Health probe returned HTTP 200 OK (latency: 14ms)</text>
    <text x="85" y="530" fill="#64748b">[00:24:21.845] <tspan fill="#38bdf8">INF</tspan> Downtime duration: 1.63 seconds. Zero human intervention required.</text>

    <!-- Webhook Notification Dispatch -->
    <text x="85" y="562" fill="#10b981" font-weight="700">[WEBHOOK DISPATCH CHANNELS]</text>
    <text x="85" y="590" fill="#94a3b8">  ✔ Slack:     https://hooks.slack.com/services/... (HTTP 200 OK — 42ms)</text>
    <text x="85" y="614" fill="#94a3b8">  ✔ Telegram:  https://api.telegram.org/bot.../sendMessage (HTTP 200 OK — 68ms)</text>
    <text x="85" y="638" fill="#94a3b8">  ✔ Flock:     https://api.flock.com/hooks/v1/url/... (HTTP 200 OK — 55ms)</text>

    <!-- Cursor prompt line -->
    <text x="85" y="674" fill="#f59e0b">deploy@recovery-daemon:~$ <tspan fill="#e2e8f0">pm2-daemon --watch --telemetry</tspan><tspan fill="#f59e0b"> █</tspan></text>
  </g>
</svg>
