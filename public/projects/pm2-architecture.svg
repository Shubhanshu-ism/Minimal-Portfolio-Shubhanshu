<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg-grad-arch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="box-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.25"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg-grad-arch)"/>

  <!-- Grid overlay -->
  <g stroke="#1e293b" stroke-width="0.75" stroke-dasharray="4,8" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="750"/>
    <line x1="300" y1="0" x2="300" y2="750"/>
    <line x1="500" y1="0" x2="500" y2="750"/>
    <line x1="700" y1="0" x2="700" y2="750"/>
    <line x1="900" y1="0" x2="900" y2="750"/>
    <line x1="1100" y1="0" x2="1100" y2="750"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Header Section -->
  <rect x="60" y="40" width="1080" height="70" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="95" cy="75" r="14" fill="#f59e0b" fill-opacity="0.15"/>
  <path d="M95 67 L90 73 H94 L92 82 L99 74 H95 Z" fill="#f59e0b"/>
  <text x="125" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
    PM2 Auto-Recovery &amp; Failure Resilience Architecture
  </text>
  <text x="125" y="92" fill="#64748b" font-family="'SF Mono', monospace" font-size="12">
    Autonomous SSH Remote Channel &#8226; MongoDB Target Registry &#8226; Multi-Channel Alert Bus
  </text>
  <rect x="1000" y="60" width="120" height="30" rx="15" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1"/>
  <text x="1060" y="79" fill="#34d399" font-family="'SF Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">99.9% UPTIME</text>

  <!-- LEFT COLUMN: Remote Target Servers -->
  <g transform="translate(60, 150)">
    <!-- Container -->
    <rect width="280" height="430" rx="16" fill="url(#box-grad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="280" height="44" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <rect y="30" width="280" height="14" fill="#111827"/>
    <text x="20" y="27" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="12" font-weight="700">01. REMOTE TARGET SERVERS</text>

    <!-- Server Box 1 -->
    <rect x="16" y="60" width="248" height="100" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="30" y="85" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Production Node Cluster #1</text>
    <text x="30" y="105" fill="#64748b" font-family="'SF Mono', monospace" font-size="11">IP: 192.168.1.42 (SSH: 22)</text>
    <rect x="30" y="120" width="90" height="22" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="75" y="135" fill="#34d399" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">PM2 DAEMON</text>
    <rect x="130" y="120" width="115" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="187" y="135" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">HTTP /healthz</text>

    <!-- Server Box 2 -->
    <rect x="16" y="175" width="248" height="100" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="30" y="200" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Worker &amp; Queue Cluster #2</text>
    <text x="30" y="220" fill="#64748b" font-family="'SF Mono', monospace" font-size="11">IP: 192.168.1.43 (SSH: 22)</text>
    <rect x="30" y="235" width="90" height="22" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="75" y="250" fill="#34d399" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">PM2 DAEMON</text>
    <rect x="130" y="235" width="115" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="187" y="250" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">HTTP /healthz</text>

    <!-- Server Box 3 -->
    <rect x="16" y="290" width="248" height="100" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="30" y="315" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">API Gateway Server #3</text>
    <text x="30" y="335" fill="#64748b" font-family="'SF Mono', monospace" font-size="11">IP: 192.168.1.44 (SSH: 22)</text>
    <rect x="30" y="350" width="90" height="22" rx="4" fill="#10b981" fill-opacity="0.15"/>
    <text x="75" y="365" fill="#34d399" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">PM2 DAEMON</text>
    <rect x="130" y="350" width="115" height="22" rx="4" fill="#38bdf8" fill-opacity="0.15"/>
    <text x="187" y="365" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">HTTP /healthz</text>

    <text x="140" y="415" fill="#64748b" font-family="'SF Mono', monospace" font-size="11" text-anchor="middle">+ Dynamically registered via REST API</text>
  </g>

  <!-- CENTER COLUMN: Auto-Recovery Microservice Engine -->
  <g transform="translate(430, 150)">
    <rect width="340" height="430" rx="16" fill="url(#box-grad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow-amber)"/>
    <rect width="340" height="44" rx="16" fill="#111827" stroke="#f59e0b" stroke-width="1"/>
    <rect y="30" width="340" height="14" fill="#111827"/>
    <text x="20" y="27" fill="#f59e0b" font-family="'SF Mono', monospace" font-size="12" font-weight="700">02. AUTO-RECOVERY DAEMON CORE</text>

    <!-- Submodule 1: Health Poller -->
    <rect x="20" y="65" width="300" height="72" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="35" y="90" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Active Polling Daemon</text>
    <text x="35" y="110" fill="#64748b" font-family="'SF Mono', monospace" font-size="11">Async event loop pinging HTTP /healthz</text>
    <circle cx="295" cy="85" r="4" fill="#10b981"/>

    <!-- Submodule 2: Failure Detection & Decision Engine -->
    <rect x="20" y="150" width="300" height="72" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="35" y="175" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Failure Detection Engine</text>
    <text x="35" y="195" fill="#64748b" font-family="'SF Mono', monospace" font-size="11">Consecutive miss threshold &amp; circuit breaker</text>
    <circle cx="295" cy="170" r="4" fill="#f59e0b"/>

    <!-- Submodule 3: Self-Healing SSH Channel -->
    <rect x="20" y="235" width="300" height="72" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="35" y="260" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Self-Healing SSH Channel</text>
    <text x="35" y="280" fill="#64748b" font-family="'SF Mono', monospace" font-size="11">Issues: `pm2 restart &lt;id&gt; --update-env`</text>
    <circle cx="295" cy="255" r="4" fill="#a855f7"/>

    <!-- Submodule 4: Target Registry & MongoDB -->
    <rect x="20" y="320" width="300" height="72" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="35" y="345" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">State &amp; Target Registry (MongoDB)</text>
    <text x="35" y="365" fill="#64748b" font-family="'SF Mono', monospace" font-size="11">Server targets, failure history, telemetry</text>
    <circle cx="295" cy="340" r="4" fill="#10b981"/>

    <text x="170" y="415" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="11" text-anchor="middle">&lt; 5s Autonomous MTTR Guarantee</text>
  </g>

  <!-- RIGHT COLUMN: Alert Dispatcher Channels -->
  <g transform="translate(860, 150)">
    <rect width="280" height="430" rx="16" fill="url(#box-grad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="280" height="44" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1"/>
    <rect y="30" width="280" height="14" fill="#111827"/>
    <text x="20" y="27" fill="#10b981" font-family="'SF Mono', monospace" font-size="12" font-weight="700">03. ALERT DISPATCH BUS</text>

    <!-- Channel 1: Slack -->
    <rect x="16" y="65" width="248" height="95" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="30" y="92" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Slack Webhook</text>
    <text x="30" y="112" fill="#64748b" font-family="'SF Mono', monospace" font-size="11">#alerts-production-incidents</text>
    <text x="30" y="132" fill="#10b981" font-family="'SF Mono', monospace" font-size="11">✔ Rich Blocks Payload (42ms)</text>

    <!-- Channel 2: Telegram -->
    <rect x="16" y="175" width="248" height="95" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="30" y="202" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Telegram Bot API</text>
    <text x="30" y="222" fill="#64748b" font-family="'SF Mono', monospace" font-size="11">@devops_incident_bot (On-Call)</text>
    <text x="30" y="242" fill="#10b981" font-family="'SF Mono', monospace" font-size="11">✔ Instant Mobile Push (68ms)</text>

    <!-- Channel 3: Flock -->
    <rect x="16" y="285" width="248" height="95" rx="10" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="30" y="312" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Flock Channel</text>
    <text x="30" y="332" fill="#64748b" font-family="'SF Mono', monospace" font-size="11">Engineering Critical Channel</text>
    <text x="30" y="352" fill="#10b981" font-family="'SF Mono', monospace" font-size="11">✔ Webhook Integration (55ms)</text>

    <text x="140" y="415" fill="#64748b" font-family="'SF Mono', monospace" font-size="11" text-anchor="middle">Pluggable Multi-Channel Dispatch</text>
  </g>

  <!-- CONNECTING ARROWS & DATAFLOWS -->
  <!-- Left to Center: Health Probe & SSH Restart -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4">
    <!-- Arrow 1: Probe from center to left -->
    <path d="M 430 235 L 340 235"/>
  </g>
  <polygon points="340,230 330,235 340,240" fill="#38bdf8"/>
  <rect x="348" y="218" width="70" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="383" y="231" fill="#38bdf8" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">HTTP GET</text>

  <!-- Arrow 2: SSH Restart from center to left -->
  <g stroke="#f59e0b" stroke-width="2">
    <path d="M 430 420 L 340 420"/>
  </g>
  <polygon points="340,415 330,420 340,425" fill="#f59e0b"/>
  <rect x="345" y="405" width="76" height="18" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="383" y="418" fill="#f59e0b" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">SSH RESTART</text>

  <!-- Center to Right: Webhook alerts -->
  <g stroke="#10b981" stroke-width="2">
    <path d="M 770 365 L 860 365"/>
  </g>
  <polygon points="850,360 860,365 850,370" fill="#10b981"/>
  <rect x="780" y="348" width="72" height="18" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="816" y="361" fill="#10b981" font-family="'SF Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">WEBHOOK</text>

  <!-- Bottom Metric Bar -->
  <g transform="translate(60, 610)">
    <rect width="1080" height="90" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

    <g transform="translate(40, 20)">
      <text x="0" y="24" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">99.9%</text>
      <text x="0" y="48" fill="#64748b" font-family="'SF Mono', monospace" font-size="11" font-weight="600">UPTIME SLA</text>
    </g>

    <g transform="translate(280, 20)">
      <text x="0" y="24" fill="#10b981" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">&lt; 5s</text>
      <text x="0" y="48" fill="#64748b" font-family="'SF Mono', monospace" font-size="11" font-weight="600">AUTONOMOUS RECOVERY</text>
    </g>

    <g transform="translate(560, 20)">
      <text x="0" y="24" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">3 Channels</text>
      <text x="0" y="48" fill="#64748b" font-family="'SF Mono', monospace" font-size="11" font-weight="600">SLACK &#8226; TELEGRAM &#8226; FLOCK</text>
    </g>

    <g transform="translate(840, 20)">
      <text x="0" y="24" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">Zero Leak</text>
      <text x="0" y="48" fill="#64748b" font-family="'SF Mono', monospace" font-size="11" font-weight="600">SSH KEY ISOLATION</text>
    </g>
  </g>
</svg>
