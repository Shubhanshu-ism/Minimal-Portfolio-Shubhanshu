<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" class="pa" role="img" aria-label="PM2 auto-recovery architecture: targets, daemon core and alert channels">
<title>PM2 auto-recovery architecture: targets, daemon core and alert channels</title>
<defs><style>.pa{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
.pa text{white-space:pre}
.pa .m{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.pa .bg{fill:var(--bg-main,#F8F9FA)}
.pa .cd{fill:var(--bg-card,#FFFFFF)}
.pa .in{fill:var(--bg-input,#F1F3F5)}
.pa .ln{stroke:var(--border-subtle,rgba(0,0,0,.07));stroke-width:1.5}
.pa .lnx{stroke:var(--text-dim,#475569);stroke-opacity:.35;stroke-width:1.5;fill:none}
.pa .t1{fill:var(--text-accent,#0F172A)}
.pa .t2{fill:var(--text-dim,#475569)}
.pa .t3{fill:var(--text-dim,#475569);fill-opacity:.7}
.pa .sk{fill:var(--text-dim,#475569);fill-opacity:.13}
.pa .dt{fill:var(--text-dim,#475569);fill-opacity:.28}</style><marker id="pm-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="pm-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="600" class="bg"/>
<rect width="960" height="44" class="cd"/>
<line x1="0" y1="44" x2="960" y2="44" class="ln"/>
<circle cx="22" cy="22" r="5" class="dt"/>
<circle cx="40" cy="22" r="5" class="dt"/>
<circle cx="58" cy="22" r="5" class="dt"/>
<text x="84" y="27" class="t1" font-size="14"><tspan font-weight="600">PM2 Auto-Recovery</tspan><tspan class="m t3" font-size="12" dx="12">architecture</tspan></text>
<rect x="833" y="11" width="103" height="22" rx="11" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="1.5"/><circle cx="845" cy="22" r="3" fill="#F59E0B"/><text x="854" y="25.96" class="m" fill="#F59E0B" font-size="11" font-weight="600">SELF-HOSTED</text>
<rect x="24" y="60" width="272" height="388" rx="14" class="cd ln"/><rect x="344" y="60" width="272" height="388" rx="14" class="cd" stroke="#F59E0B" stroke-opacity=".45" stroke-width="1.5"/><rect x="664" y="60" width="272" height="388" rx="14" class="cd ln"/><text x="44" y="88" class="t3 m" font-size="11" font-weight="600" letter-spacing="0.6">REMOTE TARGETS</text><text x="364" y="88" class="m" fill="#F59E0B" font-size="11" font-weight="600" letter-spacing="0.6">DAEMON CORE</text><text x="684" y="88" class="t3 m" font-size="11" font-weight="600" letter-spacing="0.6">ALERT CHANNELS</text><rect x="40" y="104" width="240" height="84" rx="12" class="in"/><text x="56" y="134" class="t1 m" font-size="14" font-weight="600">prod-api-01</text><text x="56" y="154" class="t3 m" font-size="11">10.0.1.12 · 4 apps</text><rect x="56" y="162" width="32" height="18" rx="9" class="in ln"/><text x="63" y="174.6" class="t2 m" font-size="10" font-weight="600">PM2</text><rect x="198" y="120" width="66" height="20" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.28" stroke-width="1.5"/><circle cx="210" cy="130" r="3" fill="#10B981"/><text x="219" y="133.6" class="m" fill="#10B981" font-size="10" font-weight="600">online</text><rect x="40" y="200" width="240" height="84" rx="12" class="in"/><text x="56" y="230" class="t1 m" font-size="14" font-weight="600">prod-worker-02</text><text x="56" y="250" class="t3 m" font-size="11">10.0.1.13 · 3 apps</text><rect x="56" y="258" width="32" height="18" rx="9" class="in ln"/><text x="63" y="270.6" class="t2 m" font-size="10" font-weight="600">PM2</text><rect x="180" y="216" width="84" height="20" rx="10" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-opacity="0.28" stroke-width="1.5"/><circle cx="192" cy="226" r="3" fill="#F59E0B"/><text x="201" y="229.6" class="m" fill="#F59E0B" font-size="10" font-weight="600">restarted</text><rect x="40" y="296" width="240" height="84" rx="12" class="in"/><text x="56" y="326" class="t1 m" font-size="14" font-weight="600">prod-gateway-03</text><text x="56" y="346" class="t3 m" font-size="11">10.0.1.14 · 2 apps</text><rect x="56" y="354" width="32" height="18" rx="9" class="in ln"/><text x="63" y="366.6" class="t2 m" font-size="10" font-weight="600">PM2</text><rect x="198" y="312" width="66" height="20" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.28" stroke-width="1.5"/><circle cx="210" cy="322" r="3" fill="#10B981"/><text x="219" y="325.6" class="m" fill="#10B981" font-size="10" font-weight="600">online</text><text x="44" y="428" class="t3" font-size="12">Registered via REST API → MongoDB</text><line x1="372" y1="124" x2="372" y2="352" class="lnx"/><circle cx="372" cy="124" r="13" class="cd" stroke="#F59E0B" stroke-opacity=".6" stroke-width="1.5"/><text x="372" y="128" class="m" fill="#F59E0B" font-size="12" font-weight="700" text-anchor="middle">1</text><text x="396" y="124" class="t1" font-size="14" font-weight="600">Poll health</text><text x="396" y="144" class="t3 m" font-size="12">jitter + concurrency lock</text><circle cx="372" cy="204" r="13" class="cd" stroke="#F59E0B" stroke-opacity=".6" stroke-width="1.5"/><text x="372" y="208" class="m" fill="#F59E0B" font-size="12" font-weight="700" text-anchor="middle">2</text><text x="396" y="204" class="t1" font-size="14" font-weight="600">Classify failure</text><text x="396" y="224" class="t3 m" font-size="12">503 → alert · 5xx → crash</text><circle cx="372" cy="284" r="13" class="cd" stroke="#F59E0B" stroke-opacity=".6" stroke-width="1.5"/><text x="372" y="288" class="m" fill="#F59E0B" font-size="12" font-weight="700" text-anchor="middle">3</text><text x="396" y="284" class="t1" font-size="14" font-weight="600">Self-heal over SSH</text><text x="396" y="304" class="t3 m" font-size="12">execFile · pm2 restart</text><circle cx="372" cy="364" r="13" class="cd" stroke="#F59E0B" stroke-opacity=".6" stroke-width="1.5"/><text x="372" y="368" class="m" fill="#F59E0B" font-size="12" font-weight="700" text-anchor="middle">4</text><text x="396" y="364" class="t1" font-size="14" font-weight="600">Verify and report</text><text x="396" y="384" class="t3 m" font-size="12">re-probe after 3s · MTTR</text><text x="364" y="428" class="t3" font-size="12">Node.js · Docker · non-root</text><rect x="680" y="104" width="240" height="84" rx="12" class="in"/><text x="696" y="134" class="t1" font-size="14" font-weight="600">Slack</text><text x="696" y="154" class="t3 m" font-size="11">#prod-incidents · Block Kit</text><rect x="850" y="120" width="54" height="20" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.28" stroke-width="1.5"/><text x="859" y="133.6" class="m" fill="#10B981" font-size="10" font-weight="600">200 OK</text><rect x="680" y="200" width="240" height="84" rx="12" class="in"/><text x="696" y="230" class="t1" font-size="14" font-weight="600">Telegram</text><text x="696" y="250" class="t3 m" font-size="11">@oncall_bot · push</text><rect x="850" y="216" width="54" height="20" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.28" stroke-width="1.5"/><text x="859" y="229.6" class="m" fill="#10B981" font-size="10" font-weight="600">200 OK</text><rect x="680" y="296" width="240" height="84" rx="12" class="in"/><text x="696" y="326" class="t1" font-size="14" font-weight="600">Flock</text><text x="696" y="346" class="t3 m" font-size="11">eng-critical · FlockML</text><rect x="850" y="312" width="54" height="20" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.28" stroke-width="1.5"/><text x="859" y="325.6" class="m" fill="#10B981" font-size="10" font-weight="600">200 OK</text><text x="684" y="428" class="t3" font-size="12">Pluggable dispatcher</text><path d="M342 150 H298" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#pm-a)"/><text x="320" y="142" class="t3 m" font-size="10" text-anchor="middle">probe</text><path d="M342 330 H298" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#pm-b)"/><text x="320" y="322" class="m" fill="#F59E0B" font-size="10" font-weight="600" text-anchor="middle">ssh</text><path d="M618 240 H662" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#pm-a)"/><text x="640" y="232" class="t3 m" font-size="10" text-anchor="middle">alert</text><rect x="24" y="464" width="293" height="112" rx="14" class="cd ln"/><text x="44" y="500" class="t1" font-size="22" font-weight="700" letter-spacing="-0.4">503 ≠ crash</text><text x="44" y="528" class="t2" font-size="13">Dependency outages alert,</text><text x="44" y="548" class="t2" font-size="13">they don't trigger a restart</text><rect x="333" y="464" width="293" height="112" rx="14" class="cd ln"/><text x="353" y="500" class="t1" font-size="22" font-weight="700" letter-spacing="-0.4">execFile</text><text x="353" y="528" class="t2" font-size="13">SSH commands run without</text><text x="353" y="548" class="t2" font-size="13">a shell, so no injection path</text><rect x="642" y="464" width="293" height="112" rx="14" class="cd ln"/><text x="662" y="500" class="t1" font-size="22" font-weight="700" letter-spacing="-0.4">3 channels</text><text x="662" y="528" class="t2" font-size="13">Slack, Telegram and Flock,</text><text x="662" y="548" class="t2" font-size="13">with MTTR in every alert</text>
</svg>
