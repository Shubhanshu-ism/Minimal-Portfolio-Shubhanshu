<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ts-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ts-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#ts-bg)"/>

  <!-- Main Platform Window -->
  <rect x="50" y="40" width="1100" height="670" rx="16" fill="url(#ts-card)" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Top Titlebar -->
  <rect x="50" y="40" width="1100" height="56" rx="16" fill="#0b0f17" stroke="#1f293d" stroke-width="1"/>
  <rect x="50" y="80" width="1100" height="16" fill="#0b0f17"/>

  <circle cx="85" cy="68" r="6" fill="#ef4444"/>
  <circle cx="105" cy="68" r="6" fill="#f59e0b"/>
  <circle cx="125" cy="68" r="6" fill="#10b981"/>

  <text x="600" y="73" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    TableSprint &#8226; AI-Powered Enterprise Workflow Automation Canvas
  </text>

  <!-- Top Canvas Header Stats -->
  <g transform="translate(85, 115)">
    <rect width="1030" height="70" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
    
    <g transform="translate(25, 16)">
      <text x="0" y="16" fill="#64748b" font-family="'SF Mono', monospace" font-size="10" font-weight="600">WORKFLOW ENGINE SPEED</text>
      <text x="0" y="40" fill="#10b981" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">75% Faster <tspan fill="#64748b" font-size="12">Execution</tspan></text>
    </g>

    <g transform="translate(280, 16)">
      <text x="0" y="16" fill="#64748b" font-family="'SF Mono', monospace" font-size="10" font-weight="600">PIPELINE RELIABILITY</text>
      <text x="0" y="40" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">99.8% Uptime</text>
    </g>

    <g transform="translate(540, 16)">
      <text x="0" y="16" fill="#64748b" font-family="'SF Mono', monospace" font-size="10" font-weight="600">REDUCED MANUAL EFFORT</text>
      <text x="0" y="40" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">40% Less Overhead</text>
    </g>

    <g transform="translate(800, 16)">
      <text x="0" y="16" fill="#64748b" font-family="'SF Mono', monospace" font-size="10" font-weight="600">INTEGRATED CONNECTORS</text>
      <text x="0" y="40" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">50+ SaaS APIs</text>
    </g>
  </g>

  <!-- Interactive Workflow Node Canvas -->
  <g transform="translate(85, 210)">
    <rect width="1030" height="475" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1"/>

    <!-- Grid Dots -->
    <g fill="#334155" opacity="0.3">
      <circle cx="50" cy="50" r="1.5"/><circle cx="150" cy="50" r="1.5"/><circle cx="250" cy="50" r="1.5"/><circle cx="350" cy="50" r="1.5"/><circle cx="450" cy="50" r="1.5"/><circle cx="550" cy="50" r="1.5"/><circle cx="650" cy="50" r="1.5"/><circle cx="750" cy="50" r="1.5"/><circle cx="850" cy="50" r="1.5"/><circle cx="950" cy="50" r="1.5"/>
      <circle cx="50" cy="150" r="1.5"/><circle cx="150" cy="150" r="1.5"/><circle cx="250" cy="150" r="1.5"/><circle cx="350" cy="150" r="1.5"/><circle cx="450" cy="150" r="1.5"/><circle cx="550" cy="150" r="1.5"/><circle cx="650" cy="150" r="1.5"/><circle cx="750" cy="150" r="1.5"/><circle cx="850" cy="150" r="1.5"/><circle cx="950" cy="150" r="1.5"/>
      <circle cx="50" cy="250" r="1.5"/><circle cx="150" cy="250" r="1.5"/><circle cx="250" cy="250" r="1.5"/><circle cx="350" cy="250" r="1.5"/><circle cx="450" cy="250" r="1.5"/><circle cx="550" cy="250" r="1.5"/><circle cx="650" cy="250" r="1.5"/><circle cx="750" cy="250" r="1.5"/><circle cx="850" cy="250" r="1.5"/><circle cx="950" cy="250" r="1.5"/>
      <circle cx="50" cy="350" r="1.5"/><circle cx="150" cy="350" r="1.5"/><circle cx="250" cy="350" r="1.5"/><circle cx="350" cy="350" r="1.5"/><circle cx="450" cy="350" r="1.5"/><circle cx="550" cy="350" r="1.5"/><circle cx="650" cy="350" r="1.5"/><circle cx="750" cy="350" r="1.5"/><circle cx="850" cy="350" r="1.5"/><circle cx="950" cy="350" r="1.5"/>
    </g>

    <!-- Node 1: Webhook Trigger -->
    <g transform="translate(40, 160)">
      <rect width="210" height="130" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
      <rect width="210" height="36" rx="12" fill="#1e293b"/>
      <rect y="24" width="210" height="12" fill="#1e293b"/>
      <circle cx="22" cy="18" r="5" fill="#3b82f6"/>
      <text x="35" y="22" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Trigger: Ingestion</text>
      <text x="16" y="60" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="11">Source: REST Webhook</text>
      <text x="16" y="80" fill="#64748b" font-family="'SF Mono', monospace" font-size="10">Payload: JSON Schema</text>
      <text x="16" y="105" fill="#10b981" font-family="'SF Mono', monospace" font-size="10" font-weight="700">✔ 12.4K msgs/sec</text>
    </g>

    <!-- Node 2: AI Parser & Extraction Agent -->
    <g transform="translate(380, 160)">
      <rect width="250" height="130" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
      <rect width="250" height="36" rx="12" fill="#1e293b"/>
      <rect y="24" width="250" height="12" fill="#1e293b"/>
      <circle cx="22" cy="18" r="5" fill="#10b981"/>
      <text x="35" y="22" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">AI Extraction Node</text>
      <text x="16" y="60" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="11">Model: Vision + Embeddings</text>
      <text x="16" y="80" fill="#64748b" font-family="'SF Mono', monospace" font-size="10">Entity Parsing: 99.4% Accuracy</text>
      <text x="16" y="105" fill="#10b981" font-family="'SF Mono', monospace" font-size="10" font-weight="700">✔ P95 Latency: 140ms</text>
    </g>

    <!-- Node 3: Enterprise Database & ERP Sync -->
    <g transform="translate(760, 80)">
      <rect width="230" height="120" rx="12" fill="#111827" stroke="#a855f7" stroke-width="1.5"/>
      <rect width="230" height="36" rx="12" fill="#1e293b"/>
      <rect y="24" width="230" height="12" fill="#1e293b"/>
      <circle cx="22" cy="18" r="5" fill="#a855f7"/>
      <text x="35" y="22" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Branch: Database Write</text>
      <text x="16" y="60" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="11">Target: PostgreSQL / Mongo</text>
      <text x="16" y="80" fill="#64748b" font-family="'SF Mono', monospace" font-size="10">ACID Transaction Commit</text>
      <text x="16" y="102" fill="#10b981" font-family="'SF Mono', monospace" font-size="10" font-weight="700">✔ 0 Record Loss</text>
    </g>

    <!-- Node 4: Webhook & CRM Notification -->
    <g transform="translate(760, 260)">
      <rect width="230" height="120" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
      <rect width="230" height="36" rx="12" fill="#1e293b"/>
      <rect y="24" width="230" height="12" fill="#1e293b"/>
      <circle cx="22" cy="18" r="5" fill="#f59e0b"/>
      <text x="35" y="22" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Branch: External Webhook</text>
      <text x="16" y="60" fill="#94a3b8" font-family="'SF Mono', monospace" font-size="11">Target: Salesforce / HubSpot</text>
      <text x="16" y="80" fill="#64748b" font-family="'SF Mono', monospace" font-size="10">Sync Status: Continuous Stream</text>
      <text x="16" y="102" fill="#10b981" font-family="'SF Mono', monospace" font-size="10" font-weight="700">✔ Retry Queue Backoff</text>
    </g>

    <!-- Connecting Bézier Curves -->
    <path d="M 250 225 C 310 225, 320 225, 380 225" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <polygon points="375,220 385,225 375,230" fill="#3b82f6"/>

    <path d="M 630 205 C 690 205, 700 140, 760 140" fill="none" stroke="#10b981" stroke-width="2"/>
    <polygon points="755,135 765,140 755,145" fill="#10b981"/>

    <path d="M 630 245 C 690 245, 700 320, 760 320" fill="none" stroke="#10b981" stroke-width="2"/>
    <polygon points="755,315 765,320 755,325" fill="#10b981"/>

    <!-- Bottom Status Text -->
    <text x="515" y="445" fill="#64748b" font-family="'SF Mono', monospace" font-size="12" text-anchor="middle">
      Automated Enterprise Pipeline &#8226; Sub-second Execution &#8226; Zero Server Downtime
    </text>
  </g>
</svg>
